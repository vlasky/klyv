name: Release

# Pushing a tag vX.Y.Z builds klyv for each platform and publishes a GitHub
# release with the binaries, checksums and that version's changelog section.
#
# A pull request that changes this file runs the build jobs only (no release
# is created), so the workflow can be tested before it is relied on.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: [".github/workflows/release.yml"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl gives a fully static Linux binary with no glibc dependency.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        # The x86_64 macOS binary is cross-built on an ARM runner; it runs
        # there under Rosetta when available, so a failure to launch is not
        # treated as a build failure for that one target.
        continue-on-error: ${{ matrix.target == 'x86_64-apple-darwin' }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/klyv"
          "$bin" --version
          db="$RUNNER_TEMP/smoke.db"
          "$bin" --db "$db" set greeting hello
          test "$("$bin" --db "$db" --format raw get greeting)" = "hello"
      - name: Package
        shell: bash
        run: |
          name="klyv-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md CHANGELOG.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "../target/${{ matrix.target }}/release/klyv.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "../target/${{ matrix.target }}/release/klyv" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: klyv-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi
      - name: Extract release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum klyv-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "klyv ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
