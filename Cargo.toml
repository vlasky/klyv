[package]
name = "klyv"
version = "0.3.1"
edition = "2024"
description = "Redis-compatible embedded KV store backed by SQLite"
license = "MIT"

[dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
rustyline = "19"

[dev-dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
tempfile = "3"
